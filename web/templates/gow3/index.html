<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>God of War III - Harp Automation</title>
  <script src="/static/socket.io.min.js"></script>

  <style>
    body { background:#0c0f16; color:#fff; font-family:system-ui; text-align:center; padding: 20px; }
    h2 { margin-bottom: 20px; }
    .btn-container { margin: 20px 0; }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      margin: 5px;
    }
    #Btn { background: #5a2ca0; }
    #Btn:active { background: #46217d; }
    #playBtn { background: #5a2ca0; }
    #playBtn:active { background: #46217d; }
    #stopBtn { background: #c0392b; }
    #stopBtn:active { background: #962d22; }
    
    #status-box {
      margin-top: 30px;
      padding: 15px;
      background: #161b26;
      border-radius: 8px;
      display: inline-block;
      min-width: 280px;
      border: 1px solid #2a344a;
    }
    #current-key {
      font-size: 24px;
      color: #3498db;
      font-weight: bold;
      margin: 10px 0;
    }
  </style>
</head>

<body>
  <a href="/">
    <button id="Btn">Home</button>
  </a>
  <h2>God of War III Harp Controller</h2>

  <div class="btn-container">
    <button id="playBtn" onclick="playHarp()">Play Harp</button>
    <button id="stopBtn" onclick="stopHarp()">Stop</button>
  </div>

  <div id="status-box">
    <div id="status-text" style="opacity: 0.7; font-size: 14px;">Status: Idle</div>
    <div id="current-key">-</div>
    <div id="progress-text" style="font-size: 13px; opacity: 0.5;">Step: 0 / 0</div>
  </div>

<script>
const socket = io();

function playHarp() {
    socket.emit("gow3: playharp", {});
}

function stopHarp() {
    socket.emit("gow3: stopharp", {});
}

// Listen for live note updates from backend
socket.on("gow3: update", (data) => {
    document.getElementById("status-text").innerText = "Playing Sequence...";
    document.getElementById("current-key").innerText = data.key;
    document.getElementById("progress-text").innerText = `Step: ${data.index} / ${data.total}`;
});

// Listen for status changes (started, stopped, completed)
socket.on("gow3: status", (data) => {
    document.getElementById("status-text").innerText = data.message;
    if (data.status === 'stopped' || data.status === 'completed') {
        document.getElementById("current-key").innerText = "-";
    }
});
</script>

</body>
</html>
